# Local WooCommerce store for ShopMind demos (free, runs on your laptop).
#
#   docker compose -f docker-compose.woocommerce.yml up -d
#   docker compose -f docker-compose.woocommerce.yml run --rm wpcli bash /scripts/setup.sh
#
# Store:  http://localhost:8080        Admin: http://localhost:8080/wp-admin  (admin / admin)
services:
  db:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
      MARIADB_ROOT_PASSWORD: root
    volumes:
      - db_data:/var/lib/mysql
    restart: unless-stopped

  wordpress:
    image: wordpress:php8.3-apache   # latest WordPress (WooCommerce needs 7.0+)
    depends_on: [db]
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
    extra_hosts:
      - "host.docker.internal:host-gateway"   # lets webhooks reach ShopMind on your laptop
    volumes:
      - wp_data:/var/www/html
      - ./woocommerce/mu-plugins:/var/www/html/wp-content/mu-plugins
    restart: unless-stopped

  wpcli:
    image: wordpress:cli-php8.3
    depends_on: [db, wordpress]
    user: "33:33"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - wp_data:/var/www/html
      - ./woocommerce/mu-plugins:/var/www/html/wp-content/mu-plugins
      - ./woocommerce/scripts:/scripts
    profiles: ["tools"]

volumes:
  db_data:
  wp_data:
